
services:
  # Frontend
  - type: web
    name: invoiceai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ML Service - Docker runtime for Tesseract OCR
  - type: web
    name: invoiceai-ml-service
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
